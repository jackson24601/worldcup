<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>World Cup</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: #f7faf7;
        background: #0f4d26;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      .pitch {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0 50%, transparent 50% 100%),
          repeating-linear-gradient(90deg, #178a40 0 56px, #1a9345 56px 112px);
      }
      .pitch::before {
        content: "";
        position: absolute;
        inset: 8%;
        border: 3px solid rgba(255, 255, 255, 0.22);
      }
      .pitch::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(28vw, 180px);
        height: min(28vw, 180px);
        transform: translate(-50%, -50%);
        border: 3px solid rgba(255, 255, 255, 0.22);
        border-radius: 50%;
        background: linear-gradient(rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.22)) center / 3px 100% no-repeat;
      }
      .crowd-backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(180deg, rgba(8, 20, 40, 0.35), rgba(8, 20, 40, 0.55)),
          url("./crowd.jpg") center / cover no-repeat;
      }
      .screen {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }
      .screen[hidden] { display: none !important; }
      .kickoff-btn[hidden],
      .semifinals-btn[hidden],
      #continue-btn[hidden] {
        display: none !important;
      }
      .landing {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .play-btn {
        display: inline-block;
        min-width: 11rem;
        padding: 1rem 2.75rem;
        border-radius: 999px;
        background: #f0c93b;
        color: #0d2818;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }
      .play-btn:hover { background: #ffd95a; }
      .team-select {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        max-width: 52rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      .team-select__header { text-align: center; }
      .back-btn {
        display: inline-flex;
        margin-bottom: 0.75rem;
        padding: 0.25rem 0.5rem;
        background: transparent;
        color: #f7faf7;
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
      }
      .team-select__title {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }
      .team-grid {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
      }
      @media (min-width: 640px) {
        .team-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }
      .team-btn {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        padding: 1rem 0.75rem;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.28);
        border: 2px solid rgba(255, 255, 255, 0.2);
        color: #f7faf7;
        font-family: system-ui, sans-serif;
      }
      .team-btn:hover,
      .team-btn--selected {
        border-color: #f0c93b;
      }
      .team-btn--selected {
        background: rgba(240, 201, 59, 0.22);
      }
      .team-btn__flag {
        width: 72px;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 4px;
      }
      .team-btn__name {
        font-size: 0.95rem;
        font-weight: 600;
      }
      .quarterfinals {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        padding: 1.5rem;
        text-align: center;
      }
      .quarterfinals__title {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        letter-spacing: 0.04em;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        animation: pop-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .matchup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.85rem, 4vw, 2rem);
        flex-wrap: wrap;
        animation: pop-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
      }
      .matchup__side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        min-width: 7rem;
      }
      .matchup__flag {
        width: clamp(88px, 18vw, 140px);
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        border: 3px solid rgba(255, 255, 255, 0.85);
        background: #fff;
      }
      .matchup__name {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-weight: 700;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      }
      .matchup__vs {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        font-weight: 700;
        color: #f0c93b;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
      }
      .kickoff-btn,
      .semifinals-btn {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.9rem 2.4rem;
        border-radius: 999px;
        background: #f0c93b;
        color: #0d2818;
        font-size: clamp(1.5rem, 4.5vw, 2.1rem);
        font-weight: 700;
        letter-spacing: 0.03em;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        animation: pop-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      }
      .kickoff-btn:hover,
      .semifinals-btn:hover { background: #ffd95a; }
      .game {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 0.75rem;
        gap: 0.65rem;
      }
      .game__message {
        margin: 0;
        min-height: 1.35em;
        text-align: center;
        font-family: system-ui, sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        color: #f0c93b;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      .goal-banner {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        background: rgba(6, 20, 12, 0.55);
        pointer-events: none;
      }
      .goal-banner[hidden] { display: none !important; }
      .goal-banner__text {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.2rem, 12vw, 6.5rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #f0c93b;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
        animation: goal-pop 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .goal-banner__team {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: clamp(1.2rem, 3.5vw, 1.8rem);
        font-weight: 700;
        color: #fff;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
        animation: goal-pop 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
      }
      @keyframes goal-pop {
        from { opacity: 0; transform: scale(0.7); }
        to { opacity: 1; transform: scale(1); }
      }
      .field {
        position: relative;
        flex: 1;
        min-height: 360px;
        border: 3px solid rgba(255, 255, 255, 0.55);
        border-radius: 10px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 50%, transparent 50% 100%),
          repeating-linear-gradient(90deg, #178a40 0 48px, #1a9345 48px 96px);
        outline: none;
      }
      .field__midline {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        background: rgba(255, 255, 255, 0.45);
        transform: translateX(-50%);
        pointer-events: none;
      }
      .field__circle {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(22vw, 120px);
        height: min(22vw, 120px);
        border: 3px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .field__goal {
        position: absolute;
        top: 50%;
        width: 18px;
        height: 36%;
        min-height: 100px;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.18);
        border: 3px solid rgba(255, 255, 255, 0.75);
        pointer-events: none;
      }
      .field__goal--left {
        left: 0;
        border-left: none;
        border-radius: 0 8px 8px 0;
      }
      .field__goal--right {
        right: 0;
        border-right: none;
        border-radius: 8px 0 0 8px;
      }
      .player {
        position: absolute;
        width: 44px;
        height: 68px;
        margin: -62px 0 0 -22px;
        z-index: 2;
        pointer-events: none;
        transform-origin: 50% 100%;
      }
      .player--away {
        transform: scaleX(-1);
      }
      .player--gk {
        width: 46px;
        height: 70px;
        margin: -64px 0 0 -23px;
      }
      .player--controlled {
        z-index: 3;
        filter: drop-shadow(0 0 4px #f0c93b) drop-shadow(0 0 8px rgba(240, 201, 59, 0.85));
      }
      .player__svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .ball {
        position: absolute;
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff 0 40%, #ececec 41% 100%);
        border: 2px solid #222;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
        z-index: 4;
      }
      .hud {
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        font-family: system-ui, sans-serif;
      }
      .hud__box {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        min-height: 3rem;
        padding: 0.55rem 0.9rem;
        border-radius: 10px;
        background: rgba(8, 28, 16, 0.82);
        border: 2px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
      }
      .hud__side {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .hud__side--right { flex-direction: row-reverse; }
      .hud__flag {
        width: 34px;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.75);
        background: #fff;
      }
      .hud__name {
        margin: 0;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .hud__score {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        min-width: 4.5rem;
        text-align: center;
      }
      .hud__clock {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .hud__half {
        margin: 0;
        font-size: 0.8rem;
        opacity: 0.85;
      }
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        background: rgba(6, 20, 12, 0.62);
        text-align: center;
      }
      .overlay[hidden] { display: none !important; }
      .overlay__title {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      .overlay__text {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 1.1rem;
      }
      .fireworks {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .firework {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        animation: burst 1.1s ease-out forwards;
      }
      @keyframes burst {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
      }
      @keyframes pop-in {
        from { opacity: 0; transform: translateY(16px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .quarterfinals__title,
        .matchup,
        .kickoff-btn,
        .semifinals-btn,
        .firework,
        .goal-banner__text,
        .goal-banner__team {
          animation: none;
        }
      }
    </style>
  </head>
  <body style="margin:0;background:#0f4d26;min-height:100vh;">
    <div id="pitch" class="pitch" aria-hidden="true"></div>
    <div id="crowd" class="crowd-backdrop" aria-hidden="true" hidden></div>

    <main id="landing" class="screen landing">
      <button
        type="button"
        id="play-btn"
        class="play-btn"
        style="background:#f0c93b;color:#0d2818;padding:1rem 2.75rem;border-radius:999px;font-size:2.5rem;font-weight:700;"
      >
        Play!
      </button>
    </main>

    <main id="team-select" class="screen team-select" hidden>
      <header class="team-select__header">
        <button type="button" id="back-btn" class="back-btn">← Back</button>
        <h1 class="team-select__title">Pick your team</h1>
      </header>
      <ul id="team-grid" class="team-grid" role="list"></ul>
    </main>

    <main id="quarterfinals" class="screen quarterfinals" hidden>
      <h1 class="quarterfinals__title">Quarterfinals!!!!!</h1>
      <div class="matchup" aria-live="polite">
        <div class="matchup__side">
          <img id="player-flag" class="matchup__flag" src="" alt="" width="140" height="93" />
          <p id="player-name" class="matchup__name"></p>
        </div>
        <p class="matchup__vs">VS</p>
        <div class="matchup__side">
          <img id="opponent-flag" class="matchup__flag" src="" alt="" width="140" height="93" />
          <p id="opponent-name" class="matchup__name"></p>
        </div>
      </div>
      <button type="button" id="kickoff-btn" class="kickoff-btn">Kickoff!!!!</button>
    </main>

    <main id="game" class="screen game" hidden>
      <p id="game-message" class="game__message" aria-live="polite"></p>
      <div id="field" class="field" tabindex="0" role="application" aria-label="Soccer match. Use arrow keys to move. Space to pass or shoot.">
        <div class="field__midline" aria-hidden="true"></div>
        <div class="field__circle" aria-hidden="true"></div>
        <div class="field__goal field__goal--left" aria-hidden="true"></div>
        <div class="field__goal field__goal--right" aria-hidden="true"></div>
        <div id="players" aria-hidden="true"></div>
        <div id="ball" class="ball" aria-hidden="true"></div>
        <div id="goal-banner" class="goal-banner" hidden>
          <p class="goal-banner__text">GOAL!!!!</p>
          <p id="goal-banner-team" class="goal-banner__team"></p>
        </div>
        <div id="overlay" class="overlay" hidden>
          <div id="fireworks" class="fireworks" aria-hidden="true"></div>
          <h2 id="overlay-title" class="overlay__title"></h2>
          <p id="overlay-text" class="overlay__text"></p>
          <button type="button" id="semifinals-btn" class="semifinals-btn" hidden>Semifinals!!!!</button>
          <button type="button" id="continue-btn" class="kickoff-btn" hidden>Continue</button>
        </div>
      </div>
      <div class="hud">
        <div class="hud__box" aria-live="polite">
          <div class="hud__side">
            <img id="game-player-flag" class="hud__flag" src="" alt="" width="34" height="23" />
            <p id="game-player-name" class="hud__name"></p>
          </div>
          <p id="game-score" class="hud__score">0 - 0</p>
          <div class="hud__side hud__side--right">
            <img id="game-opponent-flag" class="hud__flag" src="" alt="" width="34" height="23" />
            <p id="game-opponent-name" class="hud__name"></p>
          </div>
        </div>
        <div class="hud__box">
          <p id="game-half" class="hud__half">1st Half</p>
          <p id="game-clock" class="hud__clock">5:00</p>
        </div>
      </div>
    </main>

    <script>
      const DEFAULT_HALF_LENGTH_MS = 5 * 60 * 1000;
      const PLAYER_SPEED = 0.0032;
      const AI_SPEED = 0.00115;
      const BALL_FRICTION = 0.978;
      const POSSESSION_RADIUS = 0.035;
      const TACKLE_RADIUS = 0.055;
      const CHALLENGE_RADIUS = 0.048;
      const KICKER_GRACE_MS = 220;
      const POSSESSION_GRACE_MS = 180;
      const PASS_SPEED = 0.014;
      const SHOT_SPEED = 0.02;

      const TEAMS = [
        { id: "england", name: "England", flagCode: "gb-eng", color: "#f5f5f5", stroke: "#c8102e" },
        { id: "usa", name: "USA", flagCode: "us", color: "#ffffff", stroke: "#3c3b6e" },
        { id: "france", name: "France", flagCode: "fr", color: "#002395", stroke: "#ffffff" },
        { id: "mexico", name: "Mexico", flagCode: "mx", color: "#006847", stroke: "#ce1126" },
        { id: "japan", name: "Japan", flagCode: "jp", color: "#1a1a6c", stroke: "#ffffff" },
        { id: "australia", name: "Australia", flagCode: "au", color: "#ffcd00", stroke: "#00843d" },
        { id: "brazil", name: "Brazil", flagCode: "br", color: "#ffdf00", stroke: "#009c3b" },
        { id: "argentina", name: "Argentina", flagCode: "ar", color: "#75aadb", stroke: "#ffffff" },
      ];

      const landing = document.getElementById("landing");
      const teamSelect = document.getElementById("team-select");
      const quarterfinals = document.getElementById("quarterfinals");
      const game = document.getElementById("game");
      const pitch = document.getElementById("pitch");
      const crowd = document.getElementById("crowd");
      const playBtn = document.getElementById("play-btn");
      const backBtn = document.getElementById("back-btn");
      const kickoffBtn = document.getElementById("kickoff-btn");
      const teamGrid = document.getElementById("team-grid");
      const playerFlag = document.getElementById("player-flag");
      const playerName = document.getElementById("player-name");
      const opponentFlag = document.getElementById("opponent-flag");
      const opponentName = document.getElementById("opponent-name");
      const gamePlayerFlag = document.getElementById("game-player-flag");
      const gamePlayerName = document.getElementById("game-player-name");
      const gameOpponentFlag = document.getElementById("game-opponent-flag");
      const gameOpponentName = document.getElementById("game-opponent-name");
      const gameScore = document.getElementById("game-score");
      const gameMessage = document.getElementById("game-message");
      const gameClock = document.getElementById("game-clock");
      const gameHalf = document.getElementById("game-half");
      const field = document.getElementById("field");
      const playersLayer = document.getElementById("players");
      const ballEl = document.getElementById("ball");
      const goalBanner = document.getElementById("goal-banner");
      const goalBannerTeam = document.getElementById("goal-banner-team");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayText = document.getElementById("overlay-text");
      const semifinalsBtn = document.getElementById("semifinals-btn");
      const continueBtn = document.getElementById("continue-btn");
      const fireworks = document.getElementById("fireworks");

      let selectedTeam = null;
      let opponentTeam = null;
      let playerGoals = 0;
      let opponentGoals = 0;
      let half = 1;
      let halfDurationMs = DEFAULT_HALF_LENGTH_MS;
      let halfMsLeft = DEFAULT_HALF_LENGTH_MS;
      let halfStartedAt = 0;
      let clockPausedAt = 0;
      let gameActive = false;
      let matchOver = false;
      let awaitingRestart = false;
      let playerKickoffFirst = true;
      let possession = null;
      let controlledId = null;
      let shotByCpu = false;
      let rafId = 0;
      let fireworksTimer = 0;
      let lastTs = 0;
      let lastKickerId = null;
      let lastKickAt = 0;
      let possessionSince = 0;
      let actors = [];
      let ball = { x: 0.5, y: 0.5, vx: 0, vy: 0 };
      const keys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false,
        " ": false,
      };

      function flagUrl(flagCode) {
        return "https://flagcdn.com/w160/" + flagCode + ".png";
      }

      function dist(a, b) {
        var dx = a.x - b.x;
        var dy = a.y - b.y;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function hideAllScreens() {
        landing.hidden = true;
        teamSelect.hidden = true;
        quarterfinals.hidden = true;
        game.hidden = true;
      }

      function showPitchBg() {
        pitch.hidden = false;
        crowd.hidden = true;
      }

      function showCrowd() {
        pitch.hidden = true;
        crowd.hidden = false;
      }

      function formatClock(ms) {
        var total = Math.max(0, Math.ceil(ms / 1000));
        var m = Math.floor(total / 60);
        var s = total % 60;
        return m + ":" + String(s).padStart(2, "0");
      }

      function updateHud() {
        gameScore.textContent = playerGoals + " - " + opponentGoals;
        gameHalf.textContent = half === 1 ? "1st Half" : "2nd Half";
        gameClock.textContent = formatClock(halfMsLeft);
      }

      function stopLoop() {
        gameActive = false;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
        if (fireworksTimer) {
          clearTimeout(fireworksTimer);
          fireworksTimer = 0;
        }
      }

      function showLanding() {
        stopLoop();
        hideAllScreens();
        showPitchBg();
        landing.hidden = false;
        selectedTeam = null;
        opponentTeam = null;
        overlay.hidden = true;
        goalBanner.hidden = true;
      }

      function showTeamSelect() {
        stopLoop();
        hideAllScreens();
        showPitchBg();
        teamSelect.hidden = false;
      }

      function pickOpponent(playerTeam) {
        var opponents = TEAMS.filter(function (team) {
          return team.id !== playerTeam.id;
        });
        return opponents[Math.floor(Math.random() * opponents.length)];
      }

      function showQuarterfinals(playerTeam) {
        opponentTeam = pickOpponent(playerTeam);
        selectedTeam = playerTeam;
        playerFlag.src = flagUrl(playerTeam.flagCode);
        playerFlag.alt = playerTeam.name + " flag";
        playerName.textContent = playerTeam.name;
        opponentFlag.src = flagUrl(opponentTeam.flagCode);
        opponentFlag.alt = opponentTeam.name + " flag";
        opponentName.textContent = opponentTeam.name;
        hideAllScreens();
        showCrowd();
        quarterfinals.hidden = false;
      }

      function homeFormation() {
        return [
          { role: "gk", x: 0.07, y: 0.5 },
          { role: "field", x: 0.24, y: 0.28 },
          { role: "field", x: 0.24, y: 0.72 },
          { role: "field", x: 0.38, y: 0.5 },
        ];
      }

      function awayFormation() {
        return [
          { role: "gk", x: 0.93, y: 0.5 },
          { role: "field", x: 0.76, y: 0.28 },
          { role: "field", x: 0.76, y: 0.72 },
          { role: "field", x: 0.62, y: 0.5 },
        ];
      }

      function createActors() {
        actors = [];
        playersLayer.innerHTML = "";
        homeFormation().forEach(function (spot, i) {
          actors.push(makeActor("home-" + i, "home", spot.role, spot.x, spot.y, selectedTeam));
        });
        awayFormation().forEach(function (spot, i) {
          actors.push(makeActor("away-" + i, "away", spot.role, spot.x, spot.y, opponentTeam));
        });
      }

      function playerSvg(kit, trim, shorts, isGk) {
        var glove = isGk ? kit : "#f0c4a0";
        return (
          '<svg class="player__svg" viewBox="0 0 48 72" aria-hidden="true">' +
          '<ellipse cx="24" cy="69" rx="12" ry="2.5" fill="rgba(0,0,0,0.28)"/>' +
          '<rect x="14" y="46" width="6" height="16" rx="2" fill="#f0c4a0"/>' +
          '<rect x="28" y="46" width="6" height="16" rx="2" fill="#f0c4a0"/>' +
          '<rect x="13" y="38" width="22" height="10" rx="2" fill="' + shorts + '"/>' +
          '<rect x="4" y="22" width="8" height="16" rx="3" transform="rotate(18 8 22)" fill="#f0c4a0"/>' +
          '<circle cx="6" cy="40" r="3.2" fill="' + glove + '"/>' +
          '<rect x="36" y="22" width="8" height="16" rx="3" transform="rotate(-18 40 22)" fill="#f0c4a0"/>' +
          '<circle cx="42" cy="40" r="3.2" fill="' + glove + '"/>' +
          '<rect x="12" y="18" width="24" height="22" rx="5" fill="' + kit + '" stroke="' + trim + '" stroke-width="1.5"/>' +
          '<path d="M20 18l4 5 4-5" fill="none" stroke="' + trim + '" stroke-width="1.5"/>' +
          '<circle cx="24" cy="10" r="9" fill="#f0c4a0" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>' +
          '<path d="M15 10c0-7 4.5-10 9-10s9 3 9 10c-2-4-5-5-9-5s-7 1-9 5z" fill="#3b2416"/>' +
          '<circle cx="21" cy="10" r="1.2" fill="#222"/>' +
          '<circle cx="27" cy="10" r="1.2" fill="#222"/>' +
          '<path d="M21 13.5c1.2 1.4 4.8 1.4 6 0" fill="none" stroke="#b07a55" stroke-width="1.2" stroke-linecap="round"/>' +
          '<rect x="12" y="60" width="10" height="5" rx="2" fill="#111"/>' +
          '<rect x="26" y="60" width="10" height="5" rx="2" fill="#111"/>' +
          (isGk
            ? '<rect x="18" y="24" width="12" height="8" rx="2" fill="rgba(255,255,255,0.35)"/>'
            : "") +
          "</svg>"
        );
      }

      function makeActor(id, side, role, x, y, team) {
        var el = document.createElement("div");
        el.className =
          "player" +
          (role === "gk" ? " player--gk" : "") +
          (side === "away" ? " player--away" : "");
        el.dataset.id = id;

        var kit = team.color;
        var trim = team.stroke;
        var shorts = "#1a1a1a";
        if (role === "gk") {
          kit = side === "home" ? "#ff8c1a" : "#c44dff";
          trim = "#111111";
          shorts = "#222222";
        } else if (team.color.toLowerCase() === "#ffffff" || team.color.toLowerCase() === "#f5f5f5") {
          shorts = "#1b2a6b";
        }

        el.innerHTML = playerSvg(kit, trim, shorts, role === "gk");
        playersLayer.appendChild(el);
        return { id: id, side: side, role: role, x: x, y: y, el: el, team: team };
      }

      function placeActors() {
        actors.forEach(function (p) {
          p.el.style.left = p.x * 100 + "%";
          p.el.style.top = p.y * 100 + "%";
          p.el.classList.toggle("player--controlled", p.id === controlledId);
        });
        ballEl.style.left = ball.x * 100 + "%";
        ballEl.style.top = ball.y * 100 + "%";
      }

      function resetPositions(kickoffSide) {
        var home = homeFormation();
        var away = awayFormation();
        actors.forEach(function (p) {
          var spots = p.side === "home" ? home : away;
          var idx = Number(p.id.split("-")[1]);
          p.x = spots[idx].x;
          p.y = spots[idx].y;
        });
        ball.x = 0.5;
        ball.y = 0.5;
        ball.vx = 0;
        ball.vy = 0;
        shotByCpu = false;
        lastKickerId = null;
        lastKickAt = 0;
        var kicker = actors.find(function (p) {
          return p.side === kickoffSide && p.role === "field";
        });
        if (kicker) {
          kicker.x = kickoffSide === "home" ? 0.47 : 0.53;
          kicker.y = 0.5;
          possession = kicker.id;
          ball.x = kicker.x + (kickoffSide === "home" ? 0.025 : -0.025);
          ball.y = kicker.y;
        } else {
          possession = null;
        }
        updateControlled();
        placeActors();
      }

      function getActor(id) {
        return actors.find(function (p) {
          return p.id === id;
        });
      }

      function teamActors(side) {
        return actors.filter(function (p) {
          return p.side === side;
        });
      }

      function closestToBall(side, includeGk) {
        var list = teamActors(side).filter(function (p) {
          return includeGk || p.role !== "gk";
        });
        list.sort(function (a, b) {
          return dist(a, ball) - dist(b, ball);
        });
        return list[0] || null;
      }

      function updateControlled() {
        if (shotByCpu && ball.vx < -0.001) {
          var gk = actors.find(function (p) {
            return p.side === "home" && p.role === "gk";
          });
          controlledId = gk ? gk.id : null;
          return;
        }
        if (possession) {
          var holder = getActor(possession);
          if (holder && holder.side === "home") {
            controlledId = holder.id;
            return;
          }
        }
        var nearest = closestToBall("home", false);
        controlledId = nearest ? nearest.id : null;
      }

      function attachBallTo(player) {
        if (!player) return;
        possession = player.id;
        possessionSince = performance.now();
        ball.vx = 0;
        ball.vy = 0;
        ball.x = player.x + (player.side === "home" ? 0.02 : -0.02);
        ball.y = player.y;
        if (player.side === "home") shotByCpu = false;
      }

      function releaseBall(kickerId) {
        possession = null;
        lastKickerId = kickerId || null;
        lastKickAt = performance.now();
      }

      function showTackleMessage() {
        gameMessage.textContent = "Tackle!";
        setTimeout(function () {
          if (gameMessage.textContent === "Tackle!") gameMessage.textContent = "";
        }, 650);
      }

      function challengePossession() {
        if (!possession || awaitingRestart || matchOver) return;
        if (performance.now() - possessionSince < POSSESSION_GRACE_MS) return;

        var holder = getActor(possession);
        if (!holder) return;

        var challengers = actors
          .filter(function (p) {
            return p.side !== holder.side && dist(p, holder) <= CHALLENGE_RADIUS;
          })
          .sort(function (a, b) {
            return dist(a, holder) - dist(b, holder);
          });

        if (!challengers.length) return;

        // Opponent stepped into the ball carrier's space — easy steal
        attachBallTo(challengers[0]);
        showTackleMessage();
      }

      function resolveBallPlayerCollisions() {
        if (possession) return;
        var now = performance.now();
        var hits = actors
          .filter(function (p) {
            if (p.id === lastKickerId && now - lastKickAt < KICKER_GRACE_MS) return false;
            return dist(p, ball) <= TACKLE_RADIUS;
          })
          .sort(function (a, b) {
            return dist(a, ball) - dist(b, ball);
          });

        if (!hits.length) return false;

        var stopper = hits[0];
        ball.vx = 0;
        ball.vy = 0;
        ball.x = stopper.x;
        ball.y = stopper.y;
        attachBallTo(stopper);
        var kicker = lastKickerId ? getActor(lastKickerId) : null;
        if (kicker && stopper.side !== kicker.side) {
          showTackleMessage();
        }
        return true;
      }

      function ballPathHitsPlayer(fromX, fromY, toX, toY, player) {
        var now = performance.now();
        if (player.id === lastKickerId && now - lastKickAt < KICKER_GRACE_MS) return false;
        var abx = toX - fromX;
        var aby = toY - fromY;
        var apx = player.x - fromX;
        var apy = player.y - fromY;
        var abLenSq = abx * abx + aby * aby;
        var t = abLenSq ? (apx * abx + apy * aby) / abLenSq : 0;
        t = clamp(t, 0, 1);
        var closestX = fromX + abx * t;
        var closestY = fromY + aby * t;
        var dx = player.x - closestX;
        var dy = player.y - closestY;
        return Math.sqrt(dx * dx + dy * dy) <= TACKLE_RADIUS;
      }

      function movePlayer(p, dx, dy, speed) {
        if (!dx && !dy) return;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        p.x = clamp(p.x + (dx / len) * speed, 0.04, 0.96);
        p.y = clamp(p.y + (dy / len) * speed, 0.06, 0.94);
        if (p.role === "gk") {
          if (p.side === "home") p.x = clamp(p.x, 0.04, 0.14);
          else p.x = clamp(p.x, 0.86, 0.96);
          p.y = clamp(p.y, 0.28, 0.72);
        }
      }

      function handleUserInput(dtScale) {
        var controlled = getActor(controlledId);
        if (!controlled || controlled.side !== "home") return;
        var dx = 0;
        var dy = 0;
        if (keys.ArrowLeft) dx -= 1;
        if (keys.ArrowRight) dx += 1;
        if (keys.ArrowUp) dy -= 1;
        if (keys.ArrowDown) dy += 1;
        movePlayer(controlled, dx, dy, PLAYER_SPEED * dtScale);
        if (possession === controlled.id) {
          ball.x = controlled.x + 0.02;
          ball.y = controlled.y;
        }
      }

      function passOrShoot(player) {
        if (!player || possession !== player.id) return;
        var teammates = teamActors(player.side).filter(function (p) {
          return p.id !== player.id && p.role !== "gk";
        });
        var towardGoal = player.side === "home" ? 1 : -1;
        var best = null;
        var bestScore = -Infinity;
        teammates.forEach(function (mate) {
          var ahead = (mate.x - player.x) * towardGoal;
          var d = dist(player, mate);
          if (d < 0.08 || d > 0.32) return;
          if (ahead < -0.02) return;
          var score = ahead * 2 - d;
          if (score > bestScore) {
            bestScore = score;
            best = mate;
          }
        });

        releaseBall(player.id);
        if (best) {
          var pdx = best.x - player.x;
          var pdy = best.y - player.y;
          var plen = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
          ball.vx = (pdx / plen) * PASS_SPEED;
          ball.vy = (pdy / plen) * PASS_SPEED;
          gameMessage.textContent = "Pass!";
        } else {
          var targetX = player.side === "home" ? 1.02 : -0.02;
          var targetY = 0.5 + (Math.random() * 0.16 - 0.08);
          var sdx = targetX - player.x;
          var sdy = targetY - player.y;
          var slen = Math.sqrt(sdx * sdx + sdy * sdy) || 1;
          ball.vx = (sdx / slen) * SHOT_SPEED;
          ball.vy = (sdy / slen) * SHOT_SPEED;
          gameMessage.textContent = "Shot!";
          if (player.side === "away") shotByCpu = true;
        }
        setTimeout(function () {
          if (gameMessage.textContent === "Pass!" || gameMessage.textContent === "Shot!") {
            gameMessage.textContent = "";
          }
        }, 700);
      }

      function updateAi(dtScale) {
        teamActors("away").forEach(function (p) {
          if (possession === p.id) {
            var dx = -1;
            var dy = 0.5 - p.y;
            if (p.x < 0.28 && Math.abs(p.y - 0.5) < 0.18) {
              if (Math.random() < 0.02 * dtScale) passOrShoot(p);
            } else {
              movePlayer(p, dx, dy, AI_SPEED * dtScale);
              ball.x = p.x - 0.02;
              ball.y = p.y;
            }
            return;
          }
          if (p.role === "gk") {
            var gy = clamp(ball.y, 0.3, 0.7);
            movePlayer(p, 0, gy - p.y, AI_SPEED * 0.8 * dtScale);
            return;
          }
          var chase = closestToBall("away", false);
          if (chase && chase.id === p.id) {
            movePlayer(p, ball.x - p.x, ball.y - p.y, AI_SPEED * dtScale);
          } else {
            var homeX = p.id.endsWith("3") ? 0.62 : 0.76;
            movePlayer(p, homeX - p.x, 0, AI_SPEED * 0.35 * dtScale);
          }
        });

        teamActors("home").forEach(function (p) {
          if (p.id === controlledId) return;
          if (p.role === "gk") {
            if (shotByCpu) return;
            var gy = clamp(ball.y, 0.3, 0.7);
            movePlayer(p, 0, gy - p.y, PLAYER_SPEED * 0.35 * dtScale);
            return;
          }
          if (possession && getActor(possession) && getActor(possession).side === "home") {
            var supportX = clamp(ball.x - 0.08, 0.15, 0.7);
            movePlayer(p, supportX - p.x, (p.y < 0.5 ? 0.3 : 0.7) - p.y, PLAYER_SPEED * 0.25 * dtScale);
          }
        });
      }

      function pathGoalCross(fromX, fromY, toX, toY) {
        var mouthTop = 0.32;
        var mouthBottom = 0.68;
        if (fromX < 0.98 && toX >= 0.98) {
          var tr = (0.98 - fromX) / (toX - fromX || 1);
          var yr = fromY + (toY - fromY) * tr;
          if (tr >= 0 && tr <= 1 && yr > mouthTop && yr < mouthBottom) {
            return { side: "home", t: tr, x: 0.98, y: yr };
          }
        }
        if (fromX > 0.02 && toX <= 0.02) {
          var tl = (fromX - 0.02) / (fromX - toX || 1);
          var yl = fromY + (toY - fromY) * tl;
          if (tl >= 0 && tl <= 1 && yl > mouthTop && yl < mouthBottom) {
            return { side: "away", t: tl, x: 0.02, y: yl };
          }
        }
        return null;
      }

      function pathPlayerHit(fromX, fromY, toX, toY) {
        var now = performance.now();
        var best = null;
        actors.forEach(function (p) {
          if (p.id === lastKickerId && now - lastKickAt < KICKER_GRACE_MS) return;
          if (!ballPathHitsPlayer(fromX, fromY, toX, toY, p)) return;
          var abx = toX - fromX;
          var aby = toY - fromY;
          var abLenSq = abx * abx + aby * aby;
          var t = abLenSq ? ((p.x - fromX) * abx + (p.y - fromY) * aby) / abLenSq : 0;
          t = clamp(t, 0, 1);
          if (!best || t < best.t) best = { player: p, t: t };
        });
        return best;
      }

      function updateBall() {
        if (possession) {
          var holder = getActor(possession);
          if (holder) {
            ball.x = holder.x + (holder.side === "home" ? 0.02 : -0.02);
            ball.y = holder.y;
          }
          return;
        }

        var fromX = ball.x;
        var fromY = ball.y;
        var toX = ball.x + ball.vx;
        var toY = ball.y + ball.vy;

        var goalHit = pathGoalCross(fromX, fromY, toX, toY);
        var playerHit = pathPlayerHit(fromX, fromY, toX, toY);

        // Goal line wins if the ball reaches it before any player contact
        if (goalHit && (!playerHit || goalHit.t <= playerHit.t)) {
          ball.x = goalHit.x;
          ball.y = goalHit.y;
          ball.vx = 0;
          ball.vy = 0;
          scoreGoal(goalHit.side);
          return;
        }

        if (playerHit) {
          var stopper = playerHit.player;
          ball.vx = 0;
          ball.vy = 0;
          ball.x = stopper.x;
          ball.y = stopper.y;
          attachBallTo(stopper);
          var kicker = lastKickerId ? getActor(lastKickerId) : null;
          if (kicker && stopper.side !== kicker.side) {
            showTackleMessage();
          }
          return;
        }

        ball.x = toX;
        ball.y = toY;
        ball.vx *= BALL_FRICTION;
        ball.vy *= BALL_FRICTION;
        if (ball.y < 0.04) {
          ball.y = 0.04;
          ball.vy *= -0.7;
        }
        if (ball.y > 0.96) {
          ball.y = 0.96;
          ball.vy *= -0.7;
        }

        // End-line bounce only outside the goal mouth
        var inGoalY = ball.y > 0.32 && ball.y < 0.68;
        if (ball.x >= 0.98 && inGoalY) {
          scoreGoal("home");
          return;
        }
        if (ball.x <= 0.02 && inGoalY) {
          scoreGoal("away");
          return;
        }
        if (ball.x < 0.02) {
          ball.x = 0.02;
          ball.vx *= -0.65;
          shotByCpu = false;
        }
        if (ball.x > 0.98) {
          ball.x = 0.98;
          ball.vx *= -0.65;
        }
        if (Math.abs(ball.vx) < 0.00035) ball.vx = 0;
        if (Math.abs(ball.vy) < 0.00035) ball.vy = 0;
        resolveBallPlayerCollisions();
      }

      function scoreGoal(side) {
        if (awaitingRestart || matchOver) return;
        awaitingRestart = true;
        ball.vx = 0;
        ball.vy = 0;
        possession = null;
        shotByCpu = false;

        var scorersName;
        if (side === "home") {
          playerGoals += 1;
          scorersName = selectedTeam.name;
        } else {
          opponentGoals += 1;
          scorersName = opponentTeam.name;
        }
        updateHud();

        goalBannerTeam.textContent = scorersName + " score!";
        goalBanner.hidden = false;
        gameMessage.textContent = "";

        // Other team restarts from center
        var restartSide = side === "home" ? "away" : "home";
        setTimeout(function () {
          if (matchOver) return;
          goalBanner.hidden = true;
          goalBannerTeam.textContent = "";
          awaitingRestart = false;
          resetPositions(restartSide);
          gameMessage.textContent =
            (restartSide === "home" ? selectedTeam.name : opponentTeam.name) + " kick off!";
          setTimeout(function () {
            if (gameMessage.textContent.indexOf("kick off") !== -1) gameMessage.textContent = "";
          }, 1400);
        }, 1800);
      }

      function pauseClock() {
        clockPausedAt = performance.now();
      }

      function resumeClock() {
        if (clockPausedAt) {
          halfStartedAt += performance.now() - clockPausedAt;
          clockPausedAt = 0;
        }
      }

      function endHalf() {
        if (half === 1) {
          gameActive = false;
          halfMsLeft = 0;
          updateHud();
          showOverlay("Half Time", "Get ready for the second half!", false, true);
        } else {
          endMatch();
        }
      }

      function startSecondHalf() {
        hideOverlay();
        half = 2;
        halfDurationMs = DEFAULT_HALF_LENGTH_MS;
        halfMsLeft = halfDurationMs;
        halfStartedAt = performance.now();
        clockPausedAt = 0;
        gameMessage.textContent =
          (playerKickoffFirst ? opponentTeam.name : selectedTeam.name) + " kick off!";
        resetPositions(playerKickoffFirst ? "away" : "home");
        gameActive = true;
        lastTs = performance.now();
        setTimeout(function () {
          if (gameMessage.textContent.indexOf("kick off") !== -1) gameMessage.textContent = "";
        }, 1500);
        loop(lastTs);
      }

      function endMatch() {
        stopLoop();
        matchOver = true;
        halfMsLeft = 0;
        updateHud();
        var won = playerGoals > opponentGoals;
        var drawn = playerGoals === opponentGoals;
        if (won) {
          showOverlay("You Win!!!!!", selectedTeam.name + " advance!", true, false);
          launchFireworks();
        } else if (drawn) {
          showOverlay("Draw", "So close! Refresh to try again.", false, false);
        } else {
          showOverlay("Defeat", opponentTeam.name + " go through. Refresh to try again.", false, false);
        }
      }

      function showOverlay(title, text, showSemi, showContinue) {
        overlay.hidden = false;
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        semifinalsBtn.hidden = !showSemi;
        continueBtn.hidden = !showContinue;
        fireworks.innerHTML = "";
      }

      function hideOverlay() {
        overlay.hidden = true;
        semifinalsBtn.hidden = true;
        continueBtn.hidden = true;
        fireworks.innerHTML = "";
      }

      function launchFireworks(burstsLeft) {
        if (!burstsLeft) burstsLeft = 8;
        fireworks.innerHTML = "";
        var colors = ["#f0c93b", "#ff5e5e", "#5ecbff", "#ffffff", "#9dff6a", "#ff9bd4"];
        for (var i = 0; i < 40; i++) {
          var spark = document.createElement("div");
          spark.className = "firework";
          spark.style.left = 20 + Math.random() * 60 + "%";
          spark.style.top = 25 + Math.random() * 40 + "%";
          spark.style.background = colors[i % colors.length];
          spark.style.setProperty("--dx", Math.random() * 160 - 80 + "px");
          spark.style.setProperty("--dy", Math.random() * 140 - 100 + "px");
          spark.style.animationDelay = Math.random() * 0.4 + "s";
          fireworks.appendChild(spark);
        }
        if (burstsLeft > 1 && !overlay.hidden) {
          fireworksTimer = setTimeout(function () {
            launchFireworks(burstsLeft - 1);
          }, 850);
        }
      }

      function loop(ts) {
        if (!gameActive) return;
        var dt = Math.min(32, ts - lastTs || 16);
        lastTs = ts;
        var dtScale = dt / 16.67;

        if (!awaitingRestart && !clockPausedAt) {
          halfMsLeft = Math.max(0, halfDurationMs - (ts - halfStartedAt));
          updateHud();
          if (halfMsLeft <= 0) {
            endHalf();
            return;
          }
        }

        if (!awaitingRestart) {
          handleUserInput(dtScale);
          updateAi(dtScale);
          challengePossession();
          updateBall();
          updateControlled();
        }
        placeActors();
        rafId = requestAnimationFrame(loop);
      }

      function startMatch() {
        if (!selectedTeam || !opponentTeam) return;
        playerGoals = 0;
        opponentGoals = 0;
        half = 1;
        halfDurationMs = DEFAULT_HALF_LENGTH_MS;
        halfMsLeft = halfDurationMs;
        matchOver = false;
        awaitingRestart = false;
        shotByCpu = false;
        playerKickoffFirst = Math.random() < 0.5;
        hideOverlay();
        createActors();
        resetPositions(playerKickoffFirst ? "home" : "away");
        updateHud();

        gamePlayerFlag.src = flagUrl(selectedTeam.flagCode);
        gamePlayerFlag.alt = selectedTeam.name + " flag";
        gamePlayerName.textContent = selectedTeam.name;
        gameOpponentFlag.src = flagUrl(opponentTeam.flagCode);
        gameOpponentFlag.alt = opponentTeam.name + " flag";
        gameOpponentName.textContent = opponentTeam.name;

        hideAllScreens();
        showPitchBg();
        game.hidden = false;
        field.focus();

        var kickTeam = playerKickoffFirst ? selectedTeam.name : opponentTeam.name;
        gameMessage.textContent = "Coin flip: " + kickTeam + " start with the ball!";
        halfStartedAt = performance.now();
        lastTs = halfStartedAt;
        gameActive = true;
        setTimeout(function () {
          if (gameMessage.textContent.indexOf("Coin flip") !== -1) gameMessage.textContent = "";
        }, 2000);
        rafId = requestAnimationFrame(loop);
      }

      teamGrid.innerHTML = TEAMS.map(function (team) {
        return (
          '<li><button type="button" class="team-btn" data-team-id="' +
          team.id +
          '">' +
          '<img class="team-btn__flag" src="' +
          flagUrl(team.flagCode) +
          '" alt="" width="80" height="53" loading="lazy" />' +
          '<span class="team-btn__name">' +
          team.name +
          "</span></button></li>"
        );
      }).join("");

      teamGrid.addEventListener("click", function (event) {
        var button = event.target.closest(".team-btn");
        if (!button) return;
        var team = TEAMS.find(function (item) {
          return item.id === button.dataset.teamId;
        });
        if (!team) return;
        showQuarterfinals(team);
      });

      window.addEventListener("keydown", function (event) {
        if (!(event.key in keys) && event.key !== " ") return;
        if (game.hidden || !gameActive || awaitingRestart || matchOver) return;
        if (event.key === " " || event.key.startsWith("Arrow")) event.preventDefault();
        if (event.key === " ") {
          if (!keys[" "]) {
            keys[" "] = true;
            var controlled = getActor(controlledId);
            if (controlled && possession === controlled.id) passOrShoot(controlled);
          }
          return;
        }
        keys[event.key] = true;
      });

      window.addEventListener("keyup", function (event) {
        if (event.key === " ") keys[" "] = false;
        if (event.key in keys) keys[event.key] = false;
      });

      playBtn.addEventListener("click", showTeamSelect);
      backBtn.addEventListener("click", showLanding);
      kickoffBtn.addEventListener("click", startMatch);
      continueBtn.addEventListener("click", startSecondHalf);
      semifinalsBtn.addEventListener("click", function () {
        gameMessage.textContent = "Semifinals coming soon!!!!";
        hideOverlay();
      });

      // Test helpers
      window.__worldcup = {
        setHalfLength: function (ms) {
          halfDurationMs = ms;
          halfMsLeft = ms;
          halfStartedAt = performance.now();
          updateHud();
        },
        forceWin: function () {
          playerGoals = Math.max(playerGoals, opponentGoals + 1);
          updateHud();
          endMatch();
        },
        getState: function () {
          return {
            half: half,
            halfMsLeft: halfMsLeft,
            playerGoals: playerGoals,
            opponentGoals: opponentGoals,
            possession: possession,
            controlledId: controlledId,
            actorCount: actors.length,
            playerKickoffFirst: playerKickoffFirst,
            selected: selectedTeam && selectedTeam.name,
            opponent: opponentTeam && opponentTeam.name,
            overlayHidden: overlay.hidden,
            semifinalsVisible: !semifinalsBtn.hidden,
            goalBannerHidden: goalBanner.hidden,
            awaitingRestart: awaitingRestart,
            ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy },
          };
        },
        shootAtGoal: function (side) {
          // side = who scores ("home" or "away")
          possession = null;
          lastKickerId = side === "home" ? "home-3" : "away-3";
          lastKickAt = performance.now() - KICKER_GRACE_MS - 10;
          if (side === "home") {
            ball.x = 0.9;
            ball.y = 0.5;
            ball.vx = 0.08;
            ball.vy = 0;
          } else {
            ball.x = 0.1;
            ball.y = 0.5;
            ball.vx = -0.08;
            ball.vy = 0;
          }
          // Move keepers away so the shot is clean
          actors.forEach(function (p) {
            if (p.role === "gk") p.y = 0.15;
          });
          placeActors();
        },
        fireBallAt: function (side) {
          var target = actors.find(function (p) {
            return p.side === side && p.role === "field";
          });
          if (!target) return null;
          possession = null;
          lastKickerId = side === "home" ? "away-3" : "home-3";
          lastKickAt = performance.now() - KICKER_GRACE_MS - 10;
          var dir = side === "home" ? -1 : 1;
          ball.x = target.x - dir * 0.08;
          ball.y = target.y;
          ball.vx = dir * 0.05;
          ball.vy = 0;
          return { target: target.id, from: { x: ball.x, y: ball.y } };
        },
        forceChallenge: function () {
          var holder = possession ? getActor(possession) : null;
          if (!holder) {
            holder = actors.find(function (p) {
              return p.side === "home" && p.role === "field";
            });
            if (!holder) return null;
            attachBallTo(holder);
          }
          possessionSince = performance.now() - POSSESSION_GRACE_MS - 10;
          var thief = actors.find(function (p) {
            return p.side !== holder.side && p.role === "field";
          });
          if (!thief) return null;
          thief.x = holder.x + 0.01;
          thief.y = holder.y;
          placeActors();
          challengePossession();
          return {
            holderWas: holder.id,
            possession: possession,
            message: gameMessage.textContent,
          };
        },
        kickSpeeds: function () {
          return { pass: PASS_SPEED, shot: SHOT_SPEED, challenge: CHALLENGE_RADIUS };
        },
      };
    </script>
  </body>
</html>
