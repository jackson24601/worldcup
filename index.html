<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>World Cup</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: #f7faf7;
        background: #0f4d26;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      .pitch {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0 50%, transparent 50% 100%),
          repeating-linear-gradient(90deg, #178a40 0 56px, #1a9345 56px 112px);
      }
      .pitch::before {
        content: "";
        position: absolute;
        inset: 8%;
        border: 3px solid rgba(255, 255, 255, 0.22);
      }
      .pitch::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(28vw, 180px);
        height: min(28vw, 180px);
        transform: translate(-50%, -50%);
        border: 3px solid rgba(255, 255, 255, 0.22);
        border-radius: 50%;
        background: linear-gradient(rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.22)) center / 3px 100% no-repeat;
      }
      .crowd-backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(180deg, rgba(8, 20, 40, 0.35), rgba(8, 20, 40, 0.55)),
          url("./crowd.jpg") center / cover no-repeat;
      }
      .screen {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }
      .screen[hidden] { display: none !important; }
      .landing {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .play-btn {
        display: inline-block;
        min-width: 11rem;
        padding: 1rem 2.75rem;
        border-radius: 999px;
        background: #f0c93b;
        color: #0d2818;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }
      .play-btn:hover { background: #ffd95a; }
      .team-select {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        max-width: 52rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      .team-select__header { text-align: center; }
      .back-btn {
        display: inline-flex;
        margin-bottom: 0.75rem;
        padding: 0.25rem 0.5rem;
        background: transparent;
        color: #f7faf7;
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
      }
      .team-select__title {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }
      .team-grid {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
      }
      @media (min-width: 640px) {
        .team-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }
      .team-btn {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        padding: 1rem 0.75rem;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.28);
        border: 2px solid rgba(255, 255, 255, 0.2);
        color: #f7faf7;
        font-family: system-ui, sans-serif;
      }
      .team-btn:hover,
      .team-btn--selected {
        border-color: #f0c93b;
      }
      .team-btn--selected {
        background: rgba(240, 201, 59, 0.22);
      }
      .team-btn__flag {
        width: 72px;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 4px;
      }
      .team-btn__name {
        font-size: 0.95rem;
        font-weight: 600;
      }
      .quarterfinals {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        padding: 1.5rem;
        text-align: center;
      }
      .quarterfinals__title {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        letter-spacing: 0.04em;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        animation: pop-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .matchup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.85rem, 4vw, 2rem);
        flex-wrap: wrap;
        animation: pop-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
      }
      .matchup__side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        min-width: 7rem;
      }
      .matchup__flag {
        width: clamp(88px, 18vw, 140px);
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        border: 3px solid rgba(255, 255, 255, 0.85);
        background: #fff;
      }
      .matchup__name {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-weight: 700;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      }
      .matchup__vs {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        font-weight: 700;
        color: #f0c93b;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
      }
      .kickoff-btn {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.9rem 2.4rem;
        border-radius: 999px;
        background: #f0c93b;
        color: #0d2818;
        font-size: clamp(1.5rem, 4.5vw, 2.1rem);
        font-weight: 700;
        letter-spacing: 0.03em;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        animation: pop-in 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      }
      .kickoff-btn:hover { background: #ffd95a; }
      .game {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 1rem;
        gap: 0.85rem;
      }
      .scoreboard {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        font-family: system-ui, sans-serif;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      }
      .scoreboard__side {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        min-width: 7rem;
      }
      .scoreboard__side--right {
        flex-direction: row-reverse;
      }
      .scoreboard__flag {
        width: 42px;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 3px;
        border: 2px solid rgba(255, 255, 255, 0.85);
        background: #fff;
      }
      .scoreboard__name {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
      }
      .scoreboard__score {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .game__hint {
        margin: 0;
        text-align: center;
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
        color: rgba(247, 250, 247, 0.9);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      }
      .field {
        position: relative;
        flex: 1;
        min-height: 320px;
        border: 3px solid rgba(255, 255, 255, 0.55);
        border-radius: 10px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.08) 0 50%, transparent 50% 100%),
          repeating-linear-gradient(90deg, #178a40 0 48px, #1a9345 48px 96px);
        cursor: crosshair;
        touch-action: none;
      }
      .field__midline {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        background: rgba(255, 255, 255, 0.45);
        transform: translateX(-50%);
      }
      .field__circle {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(22vw, 120px);
        height: min(22vw, 120px);
        border: 3px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .field__goal {
        position: absolute;
        top: 50%;
        width: 14px;
        height: 34%;
        min-height: 90px;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.2);
        border: 3px solid rgba(255, 255, 255, 0.7);
      }
      .field__goal--left {
        left: 0;
        border-left: none;
        border-radius: 0 8px 8px 0;
      }
      .field__goal--right {
        right: 0;
        border-right: none;
        border-radius: 8px 0 0 8px;
      }
      .ball {
        position: absolute;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 30% 30%, #fff 0 35%, #f2f2f2 36% 100%);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
        border: 2px solid #222;
        z-index: 2;
      }
      .game__message {
        margin: 0;
        min-height: 1.4em;
        text-align: center;
        font-family: system-ui, sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        color: #f0c93b;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .quarterfinals__title,
        .matchup,
        .kickoff-btn {
          animation: none;
        }
      }
    </style>
  </head>
  <body style="margin:0;background:#0f4d26;min-height:100vh;">
    <div id="pitch" class="pitch" aria-hidden="true"></div>
    <div id="crowd" class="crowd-backdrop" aria-hidden="true" hidden></div>

    <main id="landing" class="screen landing">
      <button
        type="button"
        id="play-btn"
        class="play-btn"
        style="background:#f0c93b;color:#0d2818;padding:1rem 2.75rem;border-radius:999px;font-size:2.5rem;font-weight:700;"
      >
        Play!
      </button>
    </main>

    <main id="team-select" class="screen team-select" hidden>
      <header class="team-select__header">
        <button type="button" id="back-btn" class="back-btn">← Back</button>
        <h1 class="team-select__title">Pick your team</h1>
      </header>
      <ul id="team-grid" class="team-grid" role="list"></ul>
    </main>

    <main id="quarterfinals" class="screen quarterfinals" hidden>
      <h1 class="quarterfinals__title">Quarterfinals!!!!!</h1>
      <div class="matchup" aria-live="polite">
        <div class="matchup__side">
          <img id="player-flag" class="matchup__flag" src="" alt="" width="140" height="93" />
          <p id="player-name" class="matchup__name"></p>
        </div>
        <p class="matchup__vs">VS</p>
        <div class="matchup__side">
          <img id="opponent-flag" class="matchup__flag" src="" alt="" width="140" height="93" />
          <p id="opponent-name" class="matchup__name"></p>
        </div>
      </div>
      <button type="button" id="kickoff-btn" class="kickoff-btn">Kickoff!!!!</button>
    </main>

    <main id="game" class="screen game" hidden>
      <div class="scoreboard" aria-live="polite">
        <div class="scoreboard__side">
          <img id="game-player-flag" class="scoreboard__flag" src="" alt="" width="42" height="28" />
          <p id="game-player-name" class="scoreboard__name"></p>
        </div>
        <p id="game-score" class="scoreboard__score">0 - 0</p>
        <div class="scoreboard__side scoreboard__side--right">
          <img id="game-opponent-flag" class="scoreboard__flag" src="" alt="" width="42" height="28" />
          <p id="game-opponent-name" class="scoreboard__name"></p>
        </div>
      </div>
      <p class="game__hint">Click or tap the pitch to kick the ball toward the opponent goal!</p>
      <div id="field" class="field" role="application" aria-label="Soccer field">
        <div class="field__midline" aria-hidden="true"></div>
        <div class="field__circle" aria-hidden="true"></div>
        <div class="field__goal field__goal--left" aria-hidden="true"></div>
        <div class="field__goal field__goal--right" aria-hidden="true"></div>
        <div id="ball" class="ball" aria-hidden="true"></div>
      </div>
      <p id="game-message" class="game__message"></p>
    </main>

    <script>
      const TEAMS = [
        { id: "england", name: "England", flagCode: "gb-eng" },
        { id: "usa", name: "USA", flagCode: "us" },
        { id: "france", name: "France", flagCode: "fr" },
        { id: "mexico", name: "Mexico", flagCode: "mx" },
        { id: "japan", name: "Japan", flagCode: "jp" },
        { id: "australia", name: "Australia", flagCode: "au" },
        { id: "brazil", name: "Brazil", flagCode: "br" },
        { id: "argentina", name: "Argentina", flagCode: "ar" },
      ];

      const landing = document.getElementById("landing");
      const teamSelect = document.getElementById("team-select");
      const quarterfinals = document.getElementById("quarterfinals");
      const game = document.getElementById("game");
      const pitch = document.getElementById("pitch");
      const crowd = document.getElementById("crowd");
      const playBtn = document.getElementById("play-btn");
      const backBtn = document.getElementById("back-btn");
      const kickoffBtn = document.getElementById("kickoff-btn");
      const teamGrid = document.getElementById("team-grid");
      const playerFlag = document.getElementById("player-flag");
      const playerName = document.getElementById("player-name");
      const opponentFlag = document.getElementById("opponent-flag");
      const opponentName = document.getElementById("opponent-name");
      const gamePlayerFlag = document.getElementById("game-player-flag");
      const gamePlayerName = document.getElementById("game-player-name");
      const gameOpponentFlag = document.getElementById("game-opponent-flag");
      const gameOpponentName = document.getElementById("game-opponent-name");
      const gameScore = document.getElementById("game-score");
      const gameMessage = document.getElementById("game-message");
      const field = document.getElementById("field");
      const ball = document.getElementById("ball");

      let selectedTeam = null;
      let opponentTeam = null;
      let playerGoals = 0;
      let opponentGoals = 0;
      let ballX = 0.5;
      let ballY = 0.5;
      let ballVx = 0;
      let ballVy = 0;
      let gameActive = false;
      let rafId = 0;

      function flagUrl(flagCode) {
        return "https://flagcdn.com/w160/" + flagCode + ".png";
      }

      function hideAllScreens() {
        landing.hidden = true;
        teamSelect.hidden = true;
        quarterfinals.hidden = true;
        game.hidden = true;
      }

      function showPitch() {
        pitch.hidden = false;
        crowd.hidden = true;
      }

      function showCrowd() {
        pitch.hidden = true;
        crowd.hidden = false;
      }

      function showLanding() {
        stopGameLoop();
        hideAllScreens();
        showPitch();
        landing.hidden = false;
        selectedTeam = null;
        opponentTeam = null;
        teamGrid.querySelectorAll(".team-btn").forEach(function (btn) {
          btn.classList.remove("team-btn--selected");
          btn.setAttribute("aria-pressed", "false");
        });
      }

      function showTeamSelect() {
        stopGameLoop();
        hideAllScreens();
        showPitch();
        teamSelect.hidden = false;
      }

      function pickOpponent(playerTeam) {
        var opponents = TEAMS.filter(function (team) {
          return team.id !== playerTeam.id;
        });
        return opponents[Math.floor(Math.random() * opponents.length)];
      }

      function showQuarterfinals(playerTeam) {
        opponentTeam = pickOpponent(playerTeam);
        selectedTeam = playerTeam;

        playerFlag.src = flagUrl(playerTeam.flagCode);
        playerFlag.alt = playerTeam.name + " flag";
        playerName.textContent = playerTeam.name;

        opponentFlag.src = flagUrl(opponentTeam.flagCode);
        opponentFlag.alt = opponentTeam.name + " flag";
        opponentName.textContent = opponentTeam.name;

        hideAllScreens();
        showCrowd();
        quarterfinals.hidden = false;
      }

      function placeBall() {
        ball.style.left = ballX * 100 + "%";
        ball.style.top = ballY * 100 + "%";
      }

      function resetBall(center) {
        ballX = center ? 0.5 : 0.5;
        ballY = 0.5;
        ballVx = 0;
        ballVy = 0;
        placeBall();
      }

      function updateScoreboard() {
        gameScore.textContent = playerGoals + " - " + opponentGoals;
      }

      function stopGameLoop() {
        gameActive = false;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
      }

      function startGameLoop() {
        stopGameLoop();
        gameActive = true;
        function tick() {
          if (!gameActive) return;
          ballX += ballVx;
          ballY += ballVy;
          ballVx *= 0.985;
          ballVy *= 0.985;

          if (ballY < 0.04) {
            ballY = 0.04;
            ballVy *= -0.7;
          }
          if (ballY > 0.96) {
            ballY = 0.96;
            ballVy *= -0.7;
          }

          var inGoalY = ballY > 0.33 && ballY < 0.67;
          if (ballX >= 0.97 && inGoalY && Math.abs(ballVx) + Math.abs(ballVy) > 0.002) {
            playerGoals += 1;
            updateScoreboard();
            gameMessage.textContent = "GOAL!!!! " + selectedTeam.name + " scores!";
            resetBall(true);
            setTimeout(function () {
              if (gameActive) gameMessage.textContent = "";
            }, 1400);
          } else if (ballX <= 0.03 && inGoalY && Math.abs(ballVx) + Math.abs(ballVy) > 0.002) {
            opponentGoals += 1;
            updateScoreboard();
            gameMessage.textContent = "GOAL!!!! " + opponentTeam.name + " scores!";
            resetBall(true);
            setTimeout(function () {
              if (gameActive) gameMessage.textContent = "";
            }, 1400);
          } else {
            if (ballX < 0.03) {
              ballX = 0.03;
              ballVx *= -0.7;
            }
            if (ballX > 0.97) {
              ballX = 0.97;
              ballVx *= -0.7;
            }
          }

          if (Math.abs(ballVx) < 0.0004) ballVx = 0;
          if (Math.abs(ballVy) < 0.0004) ballVy = 0;

          placeBall();
          rafId = requestAnimationFrame(tick);
        }
        rafId = requestAnimationFrame(tick);
      }

      function kickToward(clientX, clientY) {
        if (!gameActive) return;
        var rect = field.getBoundingClientRect();
        var targetX = (clientX - rect.left) / rect.width;
        var targetY = (clientY - rect.top) / rect.height;
        var dx = targetX - ballX;
        var dy = targetY - ballY;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var power = Math.min(0.045, 0.018 + dist * 0.03);
        ballVx = (dx / dist) * power;
        ballVy = (dy / dist) * power;
      }

      function showGame() {
        if (!selectedTeam || !opponentTeam) return;

        playerGoals = 0;
        opponentGoals = 0;
        updateScoreboard();
        gameMessage.textContent = "Kickoff!!!!";

        gamePlayerFlag.src = flagUrl(selectedTeam.flagCode);
        gamePlayerFlag.alt = selectedTeam.name + " flag";
        gamePlayerName.textContent = selectedTeam.name;

        gameOpponentFlag.src = flagUrl(opponentTeam.flagCode);
        gameOpponentFlag.alt = opponentTeam.name + " flag";
        gameOpponentName.textContent = opponentTeam.name;

        hideAllScreens();
        showPitch();
        game.hidden = false;
        resetBall(true);
        startGameLoop();
        setTimeout(function () {
          if (gameActive) gameMessage.textContent = "";
        }, 1200);
      }

      teamGrid.innerHTML = TEAMS.map(function (team) {
        return (
          '<li><button type="button" class="team-btn" data-team-id="' +
          team.id +
          '" aria-pressed="false">' +
          '<img class="team-btn__flag" src="' +
          flagUrl(team.flagCode) +
          '" alt="" width="80" height="53" loading="lazy" />' +
          '<span class="team-btn__name">' +
          team.name +
          "</span></button></li>"
        );
      }).join("");

      teamGrid.addEventListener("click", function (event) {
        var button = event.target.closest(".team-btn");
        if (!button) return;
        var team = TEAMS.find(function (item) {
          return item.id === button.dataset.teamId;
        });
        if (!team) return;
        showQuarterfinals(team);
      });

      field.addEventListener("pointerdown", function (event) {
        kickToward(event.clientX, event.clientY);
      });

      playBtn.addEventListener("click", showTeamSelect);
      backBtn.addEventListener("click", showLanding);
      kickoffBtn.addEventListener("click", showGame);
    </script>
  </body>
</html>
