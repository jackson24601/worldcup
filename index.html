<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Cup</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="pitch" aria-hidden="true"></div>

    <main id="landing" class="screen landing">
      <button type="button" id="play-btn" class="play-btn">Play!</button>
    </main>

    <main id="team-select" class="screen team-select" hidden>
      <header class="team-select__header">
        <button type="button" id="back-btn" class="back-btn">← Back</button>
        <h1 class="team-select__title">Pick your team</h1>
      </header>
      <ul id="team-grid" class="team-grid" role="list"></ul>
      <p id="choice" class="team-select__choice" hidden></p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
